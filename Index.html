<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 3</title>

    <link rel="stylesheet" href="reset.css">

</head>
<body>
    <div id="box">
  <h1>Put Your Headphones On</h1>
  <p class="info">Pick a pair of headphones and try them on!</p>

  <ul id="how-to">
    <li><b>Click</b> a pair to choose it</li>
    <li><b>Right click</b> a pair to see info about it</li>
    <li><b>Right click</b> the person to take them off</li>
  </ul>

  <div id="stage">
    <div id="shelf">
      <p class="shelf-label">Shelf</p>
      <img class="pair selected" data-colour="red" src="Assets/img/headphones-red.png" alt="Red headphones">
      <img class="pair" data-colour="green" src="Assets/img/headphones-green.png" alt="Green headphones">
      <img class="pair" data-colour="yellow" src="Assets/img/headphones-yellow.png" alt="Yellow headphones">
    </div>

    <img id="person" src="Assets/img/sad.png" alt="A sad person with no headphones">
  </div>

  <div id="status" aria-live="polite">He's sad. He has no headphones.</div>
  <p id="hint" class="info">Selected: Red headphones</p>
  <div id="info-box"></div>

  <!-- the buttons -->
  <button id="on-button">Put headphones on</button>
  <button id="off-button">Take headphones off</button>
</div>

<script>
  // --getting the elements --
  var headphones = document.getElementById("headphones");
  var person = document.getElementById("person");
  var statusText = document.getElementById("status");
  var hint = document.getElementById("hint");
  var stage = document.getElementById("stage");
  var onButton = document.getElementById("on-button");
  var offButton = document.getElementById("off-button");

  // querySelectorAll gets ALL the headphones on the shelf (all 3)
  var pairs = document.querySelectorAll(".pair");

  var selectedColour = "red";  // which pair is chosen
  var wearingColour = "";      // which pair he's wearing ("" = none)

  // info about each pair (shows when you right click it)
  var pairInfo = {
    red: "Red headphones - the classic. Bright and loud!",
    green: "Green headphones - calm and chill, good for studying.",
    yellow: "Yellow headphones - sunny and happy, good for a road trip."
  };

  // ---------- EVENTS ON EACH PAIR OF HEADPHONES ----------
  // there are 3 pairs, so I use a for loop to give each one the same events
  for (var i = 0; i < pairs.length; i++) {
    var pair = pairs[i];

    // LEFT CLICK: choose this pair
    pair.addEventListener("click", function(event) {
      // stopPropagation stops the click "bubbling up" to the stage,
      // so the stage's tip doesn't show as well
      event.stopPropagation();
      selectPair(this.dataset.colour);

      // if he's already wearing headphones, swap to this pair
      if (wearingColour != "") {
        putOn();
      }
    });

    // DOUBLE CLICK: put this pair on straight away
    pair.addEventListener("dblclick", function(event) {
      event.stopPropagation();
      selectPair(this.dataset.colour);
      putOn();
    });

    // RIGHT CLICK: show info about this pair.
    // "contextmenu" is the event for the right mouse button.
    pair.addEventListener("contextmenu", function(event) {
      event.preventDefault();   // stops the browser's own right click menu
      event.stopPropagation();
      infoBox.innerHTML = pairInfo[this.dataset.colour];
      infoBox.style.display = "block";
    });

    // stop double click from highlighting or dragging the picture
    pair.addEventListener("mousedown", function(event) {
      event.preventDefault();
    });
  }


  // ---------- EVENTS ON THE PERSON ----------

  // RIGHT CLICK the person: take the headphones off
  person.addEventListener("contextmenu", function(event) {
    event.preventDefault();     // stops the browser's own right click menu
    event.stopPropagation();
    if (wearingColour == "") {
      hint.innerHTML = "He isn't wearing any headphones!";
    } else {
      takeOff();
    }
  });

  person.addEventListener("mousedown", function(event) {
    event.preventDefault();
  });


  // ---------- THE BUTTONS ----------
  onButton.addEventListener("click", function() {
    if (wearingColour == selectedColour) {
      hint.innerHTML = "He's already wearing those!";
    } else {
      putOn();
    }
  });

  offButton.addEventListener("click", function() {
    if (wearingColour == "") {
      hint.innerHTML = "He isn't wearing any headphones!";
    } else {
      takeOff();
    }
  });


  // ---------- clicking the empty part of the picture ----------
  // shows a tip, and hides the info box
  stage.addEventListener("click", function() {
    hint.innerHTML = "Tip: click the headphones on the shelf.";
    infoBox.style.display = "none";
  });


  // ---------- functions ----------

  // puts the dashed box around the chosen pair
  function selectPair(colour) {
    selectedColour = colour;
    for (var i = 0; i < pairs.length; i++) {
      if (pairs[i].dataset.colour == colour) {
        pairs[i].classList.add("selected");
      } else {
        pairs[i].classList.remove("selected");
      }
    }
    hint.innerHTML = "Selected: " + capital(colour) + " headphones";
    infoBox.style.display = "none";
  }

  // puts the selected pair on him
  function putOn() {
    wearingColour = selectedColour;
    person.src = "assets/img/happy-" + wearingColour + ".png";
    person.alt = "A happy person wearing " + wearingColour + " headphones";
    statusText.innerHTML = "He's happy! He's wearing the " + wearingColour + " headphones.";
    updateShelf();
  }

  // takes the headphones off
  function takeOff() {
    wearingColour = "";
    person.src = "assets/img/sad.png";
    person.alt = "A sad person with no headphones";
    statusText.innerHTML = "He's sad. He has no headphones.";
    hint.innerHTML = "Selected: " + capital(selectedColour) + " headphones";
    updateShelf();
  }

  // hides the pair he's wearing from the shelf, shows the others
  function updateShelf() {
    for (var i = 0; i < pairs.length; i++) {
      if (pairs[i].dataset.colour == wearingColour) {
        pairs[i].style.visibility = "hidden";
      } else {
        pairs[i].style.visibility = "visible";
      }
    }
  }

  // makes the first letter a capital ("red" -> "Red")
  function capital(word) {
    return word.charAt(0).toUpperCase() + word.slice(1);
  }

  /*
    REFLECTION - using this in a bigger project

    Good things:
    - Clicking is really easy, so anyone can use it straight away. A tap
      on a phone counts as a click, so it works on phones and laptops
      without any extra code.
    - Using my own drawings makes it look more personal than shapes made
      with CSS, and swapping pictures is really simple code.
    - It could be used on a headphone shop website, where you click a
      "try on" button under each pair of headphones to see them on a
      model before buying.

    Challenges:
    - Clicking a button is less "real" than dragging the headphones onto
      his head, so it might feel less fun. But it's simpler and more
      people can use it.
    - Every new item (like a hat or glasses) would need new drawings for
      every combination, which would be a lot of pictures.
    - The pictures have to be in the "images" folder next to this file,
      or they won't show up.
    - Double click doesn't really exist on phones (a double tap usually
      zooms in), so phone users would have to use the buttons.
    - The positions are in pixels, so it might not fit on a small phone
      screen. I'd need to make it responsive.
  */
</script>
</body>
</html>
